# Builds the image from this checkout; nothing is pulled from a registry.
#   cp config.example.yaml config.yaml   # then edit access.api-keys etc.
#   docker compose up -d --build
services:
  cli-proxy-api:
    image: cliproxy:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env # e.g. MANAGEMENT_PASSWORD, TZ
    # environment:
    #   TS_AUTHKEY: tskey-auth-... # Tailscale auth key (tailscale.enabled); only needed for the first join.
    # The embedded Tailscale node uses userspace networking: no extra capabilities,
    # devices or host networking are needed. Its state lives in ./data/tailscale.
    ports:
      - "8317:8317" # API + /v8/management
      - "1455:1455" # Codex OAuth callback forwarder (management OAuth flow)
      - "54545:54545" # Claude OAuth callback forwarder (management OAuth flow)
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api # oauth.auth-dir default
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_DATA_PATH:-./data}:/CLIProxyAPI/data # usage.db (observability.usage), tailscale/ node state
    restart: unless-stopped
