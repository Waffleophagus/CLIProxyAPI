# CLIProxyAPI configuration (v8 layout).
#
# Copy this file to config.yaml and replace the access.api-keys placeholders.
# While any "your-api-key-N" placeholder is configured the server starts in safe
# mode and refuses proxy requests.
#
# Uncommented values are the common settings; commented lines show optional knobs
# with their defaults. Most settings hot-reload when this file changes.
# Manage this file at runtime through /v8/management (docs/management-api-v8.md).
config-version: 8

server:
  host: "" # Bind address; "" = all interfaces, "127.0.0.1" = this machine only.
  port: 8317
  # max-request-body-bytes: 0 # Reject larger request bodies with 413; 0 = no limit.
  # trusted-proxies: [] # IPs/CIDRs allowed to supply forwarded client IP headers (restart required).
  # tls:
  #   enable: false
  #   cert: ""
  #   key: ""
  # commercial-mode: false # Disable high-overhead logging middleware to save memory.

# Management API (/v8/management). An empty secret-key disables it unless the
# MANAGEMENT_PASSWORD environment variable is set. A plaintext key is bcrypt-hashed
# in place on startup.
management:
  secret-key: ""
  # When false only localhost (127.0.0.1/::1) may call the management API; a key
  # is still required. Setting MANAGEMENT_PASSWORD overrides this and always
  # allows remote access (with either key). Under Docker, requests from the host
  # arrive from the bridge gateway and count as remote, so set true (with a
  # strong secret-key) or use MANAGEMENT_PASSWORD; also set true to manage the
  # proxy over LAN/Tailscale.
  allow-remote: false
  # disable-ui: false # Turn off the embedded web UI at /ui/ (the API keeps working).

# Keys that clients use to call this proxy (Authorization: Bearer / X-Api-Key).
# These are not upstream provider keys.
access:
  api-keys:
    - "your-api-key-1"
    - "your-api-key-2"
    - "your-api-key-3"
  # Display names for client keys in the web UI, keyed by the key id shown on the
  # Client keys page (first 8 hex chars of the key's SHA-256).
  # api-key-labels:
  #   1a2b3c4d: "opencode"

# Credential selection when several credentials can serve a model.
routing:
  strategy: "round-robin" # round-robin | weighted-round-robin | fill-first
  # Pin each client session to one credential for better prompt-cache reuse.
  # Bound sessions still fail over automatically when their credential is unavailable.
  session-affinity: false
  # session-affinity-ttl: "1h" # How long a session binding is kept.
  # session-affinity-subagents: true # Subagent sessions reuse the parent's credential.
  # session-affinity-rebind-on: "any" # "any" failure rebinds; "quota" rebinds only on quota/auth errors.
  # force-model-prefix: false # Unprefixed model names only use credentials without a prefix.
  retry:
    request-retry: 3 # Extra credential rounds after 403/408/429/5xx failures; 0 disables.
    max-retry-interval: 30 # Max seconds to wait for a cooldown between rounds; 0 = never wait.
    # max-retry-credentials: 0 # Credentials tried per round; 0 = all.
  # cooldown:
  #   disable-cooling: false # Never put failing credentials/models into cooldown.
  #   save-cooldown-status: false # Persist cooldowns as .cds files next to auth files.
  #   transient-error-cooldown-seconds: 0 # Cooldown for 408/5xx; 0 = 60s default, -1 = none.

requests:
  # Global outbound proxy: socks5://, http:// or https://. A per-credential
  # proxy-url overrides it; "direct" bypasses all proxies for that credential.
  proxy-url: ""
  # tls-handshake-timeout-seconds: 0 # Bound uTLS handshakes (Claude/Codex) only; 0 = off.
  # passthrough-headers: false # Forward filtered upstream response headers to clients.
  # nonstream-keepalive-interval: 0 # Seconds between blank keepalive bytes on non-streaming responses.
  # streaming:
  #   keepalive-seconds: 0 # SSE keepalive interval; 0 = off.
  #   bootstrap-retries: 0 # Retries allowed before the first byte reaches the client.
  #   send-keepalive-before-ft: false # Also send keepalives before the first token.

  # Payload rules edit the final upstream request body. Paths use gjson/sjson syntax.
  # Model rules support "*" wildcards and may restrict by protocol (upstream format:
  # openai, claude, codex), from-protocol (inbound: openai, responses, claude),
  # headers, match/not-match values, and exist/not-exist paths.
  # payload:
  #   default: # Set values only when missing.
  #     - models:
  #         - name: "claude-sonnet-*"
  #           protocol: "claude"
  #       params:
  #         "thinking.budget_tokens": 32768
  #   default-raw: # Like default, but values are raw JSON strings.
  #     - models:
  #         - name: "gpt-*"
  #           protocol: "openai"
  #       params:
  #         "response_format": "{\"type\":\"json_object\"}"
  #   override: # Always set values.
  #     - models:
  #         - name: "gpt-*"
  #           protocol: "codex"
  #           from-protocol: "responses"
  #           headers:
  #             X-Client-Tier: "pro-*"
  #       params:
  #         "reasoning.effort": "high"
  #   override-raw: # Like override, but values are raw JSON strings.
  #     - models:
  #         - name: "gpt-*"
  #           protocol: "codex"
  #       params:
  #         "text.format": "{\"type\":\"text\"}"
  #   filter: # Remove paths.
  #     - models:
  #         - name: "claude-*"
  #           protocol: "claude"
  #       params:
  #         - "top_k"
  #     - models:
  #         - name: "gpt-*"
  #           protocol: "codex"
  #       params:
  #         # Drop apply_patch from flat tool lists and from Codex CLI >= 0.154 additional_tools.
  #         - 'tools.#(name=="apply_patch")'
  #         - 'input.#(type=="additional_tools")#.tools.#(name=="functions")#.tools.#(name=="apply_patch")#'

# Optional model catalog sources (http(s) URL or absolute file path). Empty uses the
# official remote catalogs (or the embedded ones with --local-model).
# models:
#   catalog: ""
#   codex-catalog: ""

# Client-facing compatibility (applies to OAuth and API-key routes).
# client:
#   codex:
#     enable-apply-patch: false # Advertise freeform apply_patch for bridged models too.
#     optimize-multi-agent-v2: false # Normalize Codex multi-agent v2 requests for any upstream.
#     web-search-result-cache: # Replay cached web_search results in later turns.
#       enabled: false
#       ttl: "24h"
#       limit: 1024

# Shared upstream behavior (applies to OAuth and API-key credentials).
upstream:
  codex:
    disable-codex-cloaking: false # Stop forcing the official Codex User-Agent/Originator headers.
    # model-level-cooling: false # Scope usage-limit cooldowns to the model, not the whole credential.
    # response-steering: false # Experimental full-duplex Responses WebSocket steering.
    # orphan-delegation-compatibility: false # Convert orphan codex_app delegation outputs to user messages.
    # Hold back handshake/heartbeat frames until the first generated event so in-stream
    # server_is_overloaded rejections can fail over to another credential. Bounded by
    # 48 frames / 1 MiB, not time; set stream-bootstrap-timeout (e.g. "20s") when a
    # reverse proxy with a read timeout sits in front.
    # stream-bootstrap-buffering: false
    # stream-bootstrap-timeout: "0"
  claude:
    # Disable Claude Code cloaking (CLI disguise and system prompt rewrite) by default.
    # Per-key cloak.mode and credential attributes still override this.
    disable-claude-cloak-mode: false
    # model-level-cooling: false # Scope quota cooldowns to the model, not the whole credential.
    # tool-search: false # Map Codex tool_search to Anthropic native tool search where supported.
    # session-date-pin-days: 7 # Keep the cloaked currentDate stable per session; 0 = 1h pin.
    # disable-cloaking-model-list: false # Return original model IDs in Anthropic model lists.
    # Claude Code CLI fingerprint defaults. Change only after measuring a new Claude Code release.
    # header-defaults:
    #   user-agent: "claude-cli/2.1.280 (external, cli)"
    #   package-version: "0.112.1"
    #   runtime-version: "v26.3.0"
    #   os: "MacOS"
    #   arch: "arm64"
    #   timeout: "600"
    #   timezone: "UTC" # Fallback IANA zone for the cloaked currentDate.
    #   stabilize-device-profile: false # Pin a per-auth device fingerprint.
    #   anthropic-beta-strip: [] # Remove these betas from every request.
    #   anthropic-beta-append: [] # Append these betas to every request.
    #   inject-diagnostics: true # Add the Claude Code diagnostics field on api.anthropic.com.
    #   client-request-id: "on" # "on" | "passthrough" | "off" for x-client-request-id.
  # xai:
  #   inject-x-search: false # Inject the native x_search tool when the request lacks it.

# API-key upstreams, grouped per provider. Each group has one base-url, shared
# settings and a list of keys; per-key fields override the group. Providers:
# codex, claude, xai, meta, openai-compatibility. Uncomment what you need.

# BEGIN API KEY EXAMPLES

# api-keys:
#   codex:
#     - name: codex-1
#       base-url: "https://codex-relay.example.com" # Optional: a Codex/Responses-compatible endpoint.
#       prefix: "oai" # Optional: only serve requests for "oai/<model>".
#       proxy-url: "" # Optional: per-group proxy; "direct" bypasses proxies.
#       request-retry: 3 # Optional: override routing.retry.request-retry.
#       disable-cooling: false # Optional: override routing.cooldown.disable-cooling.
#       headers:
#         X-Custom-Header: "value" # A value like "$X-Session" copies that client header.
#       models: # Optional: expose upstream models under client aliases.
#         - name: "gpt-5-codex"
#           alias: "codex-latest"
#       excluded-models: ["*-mini"] # Exact names or "*" wildcards.
#       request-scoped-errors: # Optional: classify errors; action is stop, stop-and-cooldown, continue or continue-and-cooldown.
#         - status: 400
#           match: ["context_window_exceeded"]
#           action: "stop"
#       keys:
#         - api-key: "sk-replace-me"
#           weight: 2 # Used by weighted-round-robin; default 1.
#           websockets: false # Use the upstream Responses WebSocket transport.
#         - api-key: "sk-replace-me-too"
#
#   claude:
#     - name: anthropic
#       keys:
#         - api-key: "sk-ant-replace-me" # No base-url: official api.anthropic.com.
#     - name: claude-gateway
#       base-url: "https://gateway.example.com" # Any Anthropic Messages-compatible endpoint.
#       models:
#         - name: "claude-sonnet-4-5"
#           alias: "sonnet"
#       keys:
#         - api-key: "replace-me"
#           cloak:
#             mode: "auto" # auto (cloak non-Claude-Code clients) | always | never
#             strict-mode: false # true keeps only Claude Code system blocks.
#             sensitive-words: ["proxy"] # Obfuscated with zero-width characters.
#             cache-user-id: false # Reuse one user_id per key.
#           # fingerprint-profile: "claude-code-cli" # Send the Claude Code CLI wire fingerprint.
#
#   xai:
#     - name: xai
#       base-url: "https://api.x.ai/v1"
#       keys:
#         - api-key: "xai-replace-me"
#
#   meta:
#     - name: meta
#       base-url: "https://api.meta.ai/v1"
#       keys:
#         - api-key: "replace-me"
#
#   # Any OpenAI-compatible server (vLLM, SGLang, llama.cpp, OpenRouter, ...).
#   openai-compatibility:
#     - name: "dgx-spark"
#       base-url: "http://spark.local:8000/v1"
#       keys: [] # Leave empty for an unauthenticated server, or list {api-key: ...} entries.
#       # follow-interval: "30s" # How often follow entries poll {base-url}/models (minimum 5s).
#       models:
#         - alias: "DGX-SPARK" # Stable name clients request.
#           follow: true # Route to whatever model {base-url}/models reports; responses report the alias.
#           # match: "GLM-*" # Pick the first listed model matching this glob when several are served.
#           # name: "GLM-5.3-Flash-EXL3" # Pin an upstream model instead; a set name disables polling.
#           # max-context-length: 131072 # Context window advertised to Codex clients.
#           # use-max-completion-tokens: false # Send max_completion_tokens instead of max_tokens.
#           # input-modalities: [text, image] # Declare multimodal input support.
#           # image: false # Allow on /v1/images/* endpoints.
#           thinking:
#             levels: ["low", "medium", "high"] # Default when omitted; higher levels clamp to high.
#         # Repeating an alias across names builds a pool that round-robins and fails over.

# END API KEY EXAMPLES

# OAuth / file-backed credentials (created with --*-login or the management OAuth flow).
oauth:
  auth-dir: "~/.cli-proxy-api" # Supports ~. The Docker image mounts /root/.cli-proxy-api.
  # auth-auto-refresh-workers: 16 # Token refresh worker pool size.

  # Per-channel settings below accept: claude, codex, xai, meta.
  # They do not apply to api-keys groups.
  # model-alias: # Rename models for listing and routing.
  #   claude:
  #     - name: "claude-sonnet-4-5-20250929"
  #       alias: "cs4.5"
  #       fork: true # Keep the original name visible as well.
  #       force-mapping: true # Rewrite response model fields to the alias.
  # excluded-models: # Hide models (exact or "*" wildcard).
  #   codex:
  #     - "gpt-5-codex-mini"
  # settings: # Override per-model capabilities.
  #   codex:
  #     - name: "gpt-5-codex"
  #       max-context-length: 524288
  # request-scoped-errors:
  #   claude:
  #     - status: 400
  #       match: ["prompt is too long"]
  #       action: "stop"

  # providers:
  #   codex:
  #     signin-with-chatgpt-identifier: "CLIProxyAPI" # SIWC agent name / User-Agent prefix.
  #     header-defaults: # Used for OAuth Codex requests when the client omits them.
  #       user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
  #       beta-features: "multi_agent" # WebSocket requests only.
  #     # Relay Codex Live WebRTC media through this process (needs inbound UDP).
  #     live-media-relay:
  #       enabled: false
  #       max-sessions: 32
  #       disable-private-remote-ips: false
  #       public-ip: "" # Advertised address when behind 1:1 NAT.
  #       udp-port-min: 0 # Set both bounds to restrict the UDP range.
  #       udp-port-max: 0

# Image and video endpoints.
# multimedia:
#   disable-image-generation: false # false | true (also 404s /v1/images/*) | "chat" | "passthrough"
#   gpt-image-2-base-model: "gpt-5.4-mini" # Base model for the hosted image_generation tool path.
#   video-result-auth-cache-ttl: "3h" # How long video IDs stay bound to their credential.

observability:
  logs:
    debug: false
    logging-to-file: false # Write rotating files under logs/ instead of stdout.
    request-log: false # Log full proxy requests/responses (management requests excluded).
    # logs-max-total-size-mb: 0 # Delete oldest log files beyond this size; 0 = unlimited.
    # error-logs-max-files: 10 # Error log files kept when request-log is off; 0 = unlimited.
  usage: # Persist per-request usage (tokens, latency, errors) in SQLite for the dashboard.
    enabled: true
    # path: "" # Default: $WRITABLE_PATH/data/usage.db, else data/usage.db next to this file.
    # retention-days: 90 # Older records are pruned at startup and daily; -1 keeps everything.
    # rollup-retention-days: 0 # Totals, charts and costs; 0 keeps them forever (never shorter than retention-days).
    # pricing: # API-equivalent cost estimates from models.dev (enabled by default); edit in the UI under Usage > Pricing.
    #   models: # Price aliases, slugs and local models.
    #     - model: "gpt-oss-120b" # Served model; prices of hardware models stay with the model.
    #       price-as: "zai/glm-5.3-flash" # models.dev provider/model
    #     - model: "gpt-oss-120b"
    #       input: 0.6
    #       output: 0.9
    #       from: "2026-10-21T15:00:00Z" # Later price; earlier requests keep the previous one.
    #     - model: "my-finetune"
    #       input: 0.5 # USD per million tokens
    #       output: 1.5
    #   subscriptions: # Monthly plan fee per OAuth account, used for savings.
    #     - account: "claude-me@example.com.json"
    #       provider: "claude"
    #       monthly-usd: 200
    #   provider-classes: # Override the detected class: api, subscription or local.
    #     openai-compatible-dgx-spark: local
  # pprof: # Go profiling server; keep it on localhost.
  #   enable: false
  #   addr: "127.0.0.1:8316"

# Embedded Tailscale node (tsnet): the proxy joins your tailnet as its own
# machine and serves the same API at https://<hostname>.<tailnet>.ts.net. No
# tailscaled sidecar or extra container capabilities are needed. The LAN port
# above keeps working. Changes other than management-users need a restart.
# tailscale:
#   enabled: false
#   hostname: cliproxy # Tailnet machine name.
#   auth-key: "" # Or the TS_AUTHKEY env var; empty = log an interactive login URL (also in /v8/management/tailscale/status).
#   state-dir: "" # Node state incl. its key; default: <data dir>/tailscale ($WRITABLE_PATH/data or data/ next to this file).
#   ephemeral: false # Remove the node from the tailnet when it goes offline.
#   https: true # Serve tailnet :443 with the auto-provisioned *.ts.net cert (enable MagicDNS + HTTPS in the tailnet admin).
#   http-port: 0 # Also serve plain HTTP on this tailnet port; 0 = off (with https off, defaults to server.port).
#   management-users: [] # Tailnet login names (e.g. "you@github") allowed to use /v8/management over the tailnet without the management key.
